<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kanban Board{% endblock %}</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;background:#f4f6f9;color:#202938}
    header{background:#202b3c;color:white;padding:18px 5%}header h1{margin:0;font-size:22px}
    nav{display:flex;gap:10px;flex-wrap:wrap;padding:14px 5%;background:white;border-bottom:1px solid #ddd}
    nav a,.btn{display:inline-block;padding:9px 14px;border:0;border-radius:6px;background:#315b91;color:white;text-decoration:none;cursor:pointer}
    nav a:hover,.btn:hover{background:#24466f}main{max-width:1100px;margin:28px auto;padding:0 18px}
    .panel{background:white;padding:20px;border-radius:9px;margin-bottom:18px;box-shadow:0 2px 8px #0000000b}
    input,textarea,select{display:block;width:100%;max-width:520px;padding:10px;margin:7px 0 14px;border:1px solid #cbd2dc;border-radius:5px}
    button{font-size:14px}.muted{color:#687386}.status{padding:10px;border-radius:6px;background:#eef2f7;margin:10px 0}
    table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #e5e8ed}
    .actions{display:flex;gap:8px;flex-wrap:wrap}.danger{background:#a83c3c}
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<header><h1>Система управления задачами Kanban Board</h1></header>
<nav>
  <a href="/">Главная</a>
  <a href="/projects-page">Проекты</a>
  <a href="/tasks-page">Задачи</a>
  <a href="/task-form">Создать задачу</a>
  <a href="/users-page">Сотрудники</a>
</nav>
<main>{% block content %}{% endblock %}</main>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=TikTok+Sans:opsz,wght@12..36,300..900&display=swap" rel="stylesheet">
  <title>Вход и регистрация — PROJECTHUB</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
<main class="auth-page">
  <button class="theme-toggle" id="themeToggle" type="button"
          aria-label="Переключить на тёмную тему" aria-pressed="false">
    <span class="theme-toggle-icon" aria-hidden="true">☾</span>
    <span class="theme-toggle-label">Тёмная тема</span>
  </button>
  <div class="wave-scene" aria-hidden="true">
    <span class="wave wave-back"></span>
    <span class="wave wave-middle"></span>
    <span class="wave wave-front"></span>
    <span class="wave-glow"></span>
    <span class="wave-grain"></span>
  </div>
<section class="auth">
  <div class="auth-brand-logo" aria-label="PROJECTHUB">
    <img class="auth-logo-light" src="{{ url_for('static', filename='img/projecthub-logo-light.png') }}" alt="PROJECTHUB">
    <img class="auth-logo-dark" src="{{ url_for('static', filename='img/projecthub-logo-dark.png') }}" alt="PROJECTHUB">
  </div>
  <p class="auth-kicker">КОМАНДНАЯ РАБОТА</p>
  <h1>PROJECTHUB</h1>
  <p class="subtitle">Система управления задачами</p>

  <div class="tabs">
    <button id="loginTab" class="active" type="button">Авторизация</button>
    <button id="registerTab" type="button">Регистрация</button>
  </div>

  <form id="loginForm" novalidate>
    <label for="login">Логин или Email</label>
    <input id="login" name="login" autocomplete="username" required maxlength="254">
    <label for="loginPassword">Пароль</label>
    <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
    <button class="submit" type="submit">Войти</button>
  </form>

  <form id="registerForm" class="hidden" novalidate>
    <label for="full_name">ФИО (необязательно)</label>
    <input id="full_name" name="full_name" autocomplete="name" maxlength="100">
    <label for="username">Логин</label>
    <input id="username" name="username" autocomplete="username" minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
    <label for="registerPassword">Пароль (не менее 8 символов)</label>
    <input id="registerPassword" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
    <label for="confirmPassword">Повторите пароль</label>
    <input id="confirmPassword" name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
    <button class="submit" type="submit">Зарегистрироваться</button>
  </form>

  <div id="message" class="message" role="alert" aria-live="polite"></div>
</section>
</main>
<script src="{{ url_for('static', filename='js/auth.js') }}" defer></script>
</body>
</html>

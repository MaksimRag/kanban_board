{% extends "base.html" %}
{% block title %}Создание задачи — PROJECTHUB{% endblock %}
{% block page_styles %}<link rel="stylesheet" href="{{ url_for('static', filename='css/task_form.css') }}">{% endblock %}
{% block content %}
<section class="task-create-page">
 <div class="panel task-create-card">
  <header class="task-create-heading">
   <h2>Создание задачи</h2>
   <p>Заполните информацию и назначьте ответственного участника</p>
  </header>
  <form id="taskForm" class="task-create-form">
   <div class="task-form-field task-form-field-wide">
    <label for="taskTitle">Название задачи</label>
    <input id="taskTitle" name="title" maxlength="200" placeholder="Например, подготовить макет главной страницы" required>
   </div>
   <div class="task-form-field task-form-field-wide">
    <label for="taskDescription">Описание</label>
    <textarea id="taskDescription" name="description" rows="4" placeholder="Опишите цель, детали и ожидаемый результат"></textarea>
   </div>
   <div class="task-form-field">
    <label for="project">Проект</label>
    <select name="project_id" id="project" required></select>
   </div>
   <div class="task-form-field">
    <label for="assignee">Исполнитель</label>
    <select name="assignee_id" id="assignee"><option value="">Не назначен</option></select>
   </div>
   <div class="task-form-field task-form-field-wide">
    <label for="taskStatus">Статус</label>
    <select name="status" id="taskStatus"><option value="TODO">Новая</option><option value="IN_PROGRESS">В работе</option><option value="DONE">Выполнена</option></select>
   </div>
   <div class="task-create-actions">
    <button class="btn" type="submit">Сохранить задачу</button>
    <a class="btn btn-secondary" href="/tasks-page">К списку задач</a>
   </div>
  </form>
  <p id="message" class="muted task-form-message" role="status"></p>
 </div>
</section>
{% block page_scripts %}<script src="{{ url_for('static', filename='js/task_form.js') }}" defer></script>{% endblock %}
{% endblock %}

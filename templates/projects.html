{% extends "base.html" %}
{% block title %}Проекты — Kanban Board{% endblock %}
{% block content %}
<section class="panel">
  <h2>Создание проекта</h2>
  <form id="projectForm">
    <label>Название проекта</label>
    <input name="name" required>
    <label>Описание</label>
    <textarea name="description"></textarea>
    <label>Владелец проекта</label>
    <select name="owner_id" id="owner" required></select>
    <button class="btn" type="submit">Создать проект</button>
  </form>
  <p id="message" class="muted"></p>
</section>
<section class="panel">
  <h2>Список проектов</h2>
  <div id="projects">Загрузка...</div>
</section>
<script>
async function loadOwners() {
  const response = await fetch('/users/');
  if (!response.ok) throw new Error('Не удалось загрузить сотрудников');
  const users = await response.json();
  const select = document.getElementById('owner');
  select.innerHTML = users.map(user =>
    `<option value="${user._id}">${escapeHtml(user.full_name || user.username)}</option>`
  ).join('');
  if (!users.length) select.innerHTML = '<option value="">Сначала добавьте сотрудника</option>';
}
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
  })[char]);
}
async function loadProjects() {
  const response = await fetch('/projects/');
  if (!response.ok) throw new Error('Не удалось загрузить проекты');
  const projects = await response.json();
  document.getElementById('projects').innerHTML = projects.length
    ? projects.map(project => `<div class="status">
        <b>${escapeHtml(project.name)}</b>
        <p>${escapeHtml(project.description || '')}</p>
        <small>ID владельца: ${escapeHtml(project.owner_id || '')}</small>
        <p><button class="btn danger" onclick="removeProject('${project._id}')">Удалить проект</button></p>
      </div>`).join('')
    : 'Проектов пока нет.';
}
document.getElementById('projectForm').addEventListener('submit', async event => {
  event.preventDefault();
  const data = Object.fromEntries(new FormData(event.target));
  const message = document.getElementById('message');
  try {
    const response = await fetch('/projects/', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'Не удалось создать проект');
    message.textContent = 'Проект создан.';
    event.target.reset();
    await loadProjects();
  } catch (error) { message.textContent = error.message; }
});
async function removeProject(id) {
  if (!confirm('Удалить проект? Проверь, не удалятся ли связанные с ним задачи.')) return;
  const response = await fetch('/projects/' + id, {method: 'DELETE'});
  if (response.ok) loadProjects();
  else alert('Не удалось удалить проект');
}
Promise.all([loadOwners(), loadProjects()]).catch(error => {
  document.getElementById('projects').textContent = error.message;
});
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}Проекты — Kanban Board{% endblock %}
{% block content %}
<section class="panel">
  <h2>Создание проекта</h2>
  <form id="projectForm">
    <label>Название проекта</label>
    <input name="name" required>
    <label>Описание</label>
    <textarea name="description"></textarea>
    <p class="muted">Владельцем проекта автоматически станет пользователь, который его создаёт.</p>
    <button class="btn" type="submit">Создать проект</button>
  </form>
  <p id="message" class="muted"></p>
</section>
<section class="panel">
  <h2>Список проектов</h2>
  <div id="projects">Загрузка...</div>
</section>
<script>
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
  })[char]);
}
async function loadProjects() {
  const response = await fetch('/projects/');
  if (!response.ok) throw new Error('Не удалось загрузить проекты');
  const projects = await response.json();
  document.getElementById('projects').innerHTML = projects.length
    ? projects.map(project => `<div class="status">
        <b>${escapeHtml(project.name)}</b>
        <p>${escapeHtml(project.description || '')}</p>
        <small>Владелец: ${escapeHtml(project.owner_username || 'Неизвестный пользователь')}</small>
        ${project.can_manage
          ? `<p><button class="btn danger" onclick="removeProject('${escapeHtml(project._id)}')">Удалить проект</button></p>`
          : `<small class="muted">Управлять проектом может только его создатель.</small>`}
      </div>`).join('')
    : 'Проектов пока нет.';
}
document.getElementById('projectForm').addEventListener('submit', async event => {
  event.preventDefault();
  const data = Object.fromEntries(new FormData(event.target));
  const message = document.getElementById('message');
  try {
    const response = await fetch('/projects/', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'Не удалось создать проект');
    message.textContent = 'Проект создан. Вы являетесь его владельцем.';
    event.target.reset();
    await loadProjects();
  } catch (error) { message.textContent = error.message; }
});
async function removeProject(id) {
  if (!confirm('Удалить проект и связанные с ним задачи?')) return;
  try {
    const response = await fetch('/projects/' + encodeURIComponent(id), {method: 'DELETE'});
    if (!response.ok) {
      const result = await response.json();
      throw new Error(result.error || 'Не удалось удалить проект');
    }
    await loadProjects();
  } catch (error) { alert(error.message); }
}
loadProjects().catch(error => {
  document.getElementById('projects').textContent = error.message;
});
</script>
{% endblock %}
